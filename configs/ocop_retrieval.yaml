# Retrieval, context and fusion parameters. Each value's reason is in docs/CONFIGURATION.md.
schema_version: 1
context:
  # Whole answer prompt (system + question + SOURCE blocks) budget in estimated tokens. The answer model
  # window is llm.context_tokens in ocop_models.yaml; the rest is kept for the generated claims.
  prompt_token_budget: 5200
  output_reserve_tokens: 1024
  excerpt_max_chars: 1500          # prose chunk window
  table_excerpt_max_chars: 5000    # table rows are short; keep the whole matched table chunk
  parent_chain_max_tokens: 40      # graph parent labels prepended to an indexed chunk
  parent_label_max_chars: 90
  min_term_coverage: 0.25          # share of question content terms present in the prompt SOURCE text; below it no generation
retrieval:
  top_k: 8
  candidate_pool_min: 40           # sparse/dense candidates before fusion
  rrf_k: 60
  rrf_weight_sparse: 1.0
  rrf_weight_dense: 1.0
  rerank_candidates: 8             # cross-encoder pairs per query: ~1 s per 512-token pair on 6 CPU cores
  rerank_batch_size: 4
  rerank_threads: 6
  rerank_cache_entries: 512
  query_max_chars: 1500
agent:
  max_tool_calls: 5                # AGENTS.md: default maximum of five tool calls per question
  grader_min_relevance: 0.13       # min share of question terms in a row for it to count as relevant evidence
  scope_min_bigram_coverage: 0.60  # share of query content bigrams in one indexed chunk that reopens an unrecognised question
  graph_hops: 2
  graph_node_limit: 75
  graph_max_facts: 32
