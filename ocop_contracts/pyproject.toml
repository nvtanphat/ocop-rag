[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocop-contracts"
version = "0.1.0"
description = "Lightweight OCOP provenance, registry and page contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools]
packages = ["ocop_contracts"]
package-dir = {ocop_contracts = "."}
